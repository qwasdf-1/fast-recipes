name: Alpha prerelease

on:
  push:
    tags: ['v*-alpha.*']

permissions:
  contents: write

jobs:
  alpha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Check documentation and build
        run: |
          python3 scripts/check_doc_boundary.py
          ./gradlew build
      - name: Match the tested JAR and publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          jar="build/libs/fast-recipes-${version}.jar"
          digest="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed -nE 's/^SHA256 ([0-9a-f]{64})$/\1/p')"
          test "${#digest}" -eq 64
          printf '%s  %s\n' "$digest" "$jar" | sha256sum --check
          awk -v heading="## $version" '$0 == heading { found=1; next } found && /^## / { exit } found' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          gh release create "$GITHUB_REF_NAME" "$jar" --verify-tag --prerelease \
            --title "Fast Recipes $version" --notes-file release-notes.md
